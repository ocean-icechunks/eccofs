name: Update ECCOFS avg best-estimate store

# Rebuilds the best-estimate store (ocean-icechunks/noaa-eccofs/eccofs-avg-best: one monotonic valid time) in place
# when the FMRC store has a newer run than the one recorded in the store. The best series is chosen from
# the FMRC store, so this runs after the FMRC workflow succeeds.
on:
  workflow_run:
    workflows: ["Update ECCOFS avg FMRC store"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: update-avg
  cancel-in-progress: false

jobs:
  update:
    # a manual dispatch always runs; a chained run only if the FMRC update succeeded
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      id-token: write  # lets aws-actions/configure-aws-credentials exchange the GitHub token for a role
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Sign in to Source Cooperative as ocean-icechunks--noaa-eccofs-updates
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::ocean-icechunks--noaa-eccofs-updates:role/FullAccess
          audience: https://data.source.coop
          sts-endpoint: https://data.source.coop/.sts
          aws-region: us-west-2
      - run: python scripts/build_avg_best.py --update --expire-days 7
