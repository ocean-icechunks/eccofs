name: Build avg stores without subchunking (one-off)

# One-time build of the two virtual stores that keep NOAA's chunking (all vertical levels of a tile in one
# chunk), which suits vertical profiles and sections: ocean-icechunks/noaa-eccofs/eccofs-avg-fmrc-nosub and
# eccofs-avg-best-nosub. Afterwards the daily update workflows keep them current. Both scripts refuse to
# touch an existing repository unless told to, and build_avg.py resumes by diffing reference times, so
# re-running this after a failure or an expired token is safe.
on:
  workflow_dispatch:

concurrency:
  group: update-avg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Sign in to Source Cooperative as ocean-icechunks--noaa-eccofs-updates
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::ocean-icechunks--noaa-eccofs-updates:role/FullAccess
          audience: https://data.source.coop
          sts-endpoint: https://data.source.coop/.sts
          aws-region: us-west-2
      - name: Forecast-run store
        run: python scripts/build_avg.py --no-subchunk --create --prefix noaa-eccofs/eccofs-avg-fmrc-nosub
      - name: Best-estimate store
        run: python scripts/build_avg_best.py --no-subchunk --create --update --prefix noaa-eccofs/eccofs-avg-best-nosub
