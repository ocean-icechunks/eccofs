name: Add scalar model parameters to the avg stores

# One-off: writes the ROMS scalars that build_avg.py drops (Vtransform, Vstretching, theta_s, theta_b,
# Tcline, hc, rho0, spherical) into both stores as 0-d arrays, so xroms can compute depths.
# Existing data is not touched. Run with dry_run first, then again without it. Safe to repeat.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the values and store state, write nothing"
        type: boolean
        default: true

# the stores are also written by the daily update workflows
concurrency:
  group: update-avg
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write  # lets aws-actions/configure-aws-credentials exchange the GitHub token for a role
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Sign in to Source Cooperative as ocean-icechunks--noaa-eccofs-updates
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::ocean-icechunks--noaa-eccofs-updates:role/FullAccess
          audience: https://data.source.coop
          sts-endpoint: https://data.source.coop/.sts
          aws-region: us-west-2
      - name: Add the scalars to both stores
        run: |
          for store in eccofs-avg-best eccofs-avg-fmrc; do
            python scripts/add_scalars.py --prefix noaa-eccofs/$store ${{ inputs.dry_run && '--dry-run' || '' }}
          done
