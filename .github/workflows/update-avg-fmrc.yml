name: Update ECCOFS avg FMRC store

# Appends new forecast runs to the FMRC store (esip/rsignell/eccofs-avg: time = run reference time,
# step = lead day). build_avg.py diffs the reference times already in the store against the complete
# runs in NOAA's bucket, so a day with nothing new is a no-op.
on:
  schedule:
    - cron: "30 15 * * *"   # daily, 15:30 UTC
  workflow_dispatch:

# never run two updates at once: the stores are written by both avg workflows
concurrency:
  group: update-avg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # deliberately not AWS_*: those would also redirect the anonymous reads of NOAA's bucket
      OSN_ACCESS_KEY_ID: ${{ secrets.OSN_ACCESS_KEY_ID }}
      OSN_SECRET_ACCESS_KEY: ${{ secrets.OSN_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/build_avg.py --expire-days 7
